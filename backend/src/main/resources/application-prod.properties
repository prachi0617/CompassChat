# Production profile — activated with SPRING_PROFILES_ACTIVE=prod.
# Uses PostgreSQL (data persists across restarts) instead of in-memory H2.
# All connection values come from environment variables.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Create/update the schema from the entities; data is preserved across restarts.
# The demo seeders are idempotent, so they populate only on first boot.
spring.jpa.hibernate.ddl-auto=update

# H2 console is dev-only; disabled in production.
spring.h2.console.enabled=false
