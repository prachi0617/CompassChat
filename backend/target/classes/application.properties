# Server port (8080 is taken by the FirstStep project locally)
server.port=8081

# H2 datasource (PostgreSQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:compasschat;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# H2 console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
app.jwt.secret=CompassChatSuperSecretKeyForDevelopmentOnly1234567890
app.jwt.expiration-ms=86400000

# Ollama local LLM (optional — set OLLAMA_URL and optionally OLLAMA_MODEL to enable)
ollama.api.url=${OLLAMA_URL:}
ollama.model=${OLLAMA_MODEL:gemma2:2b}

# Groq via OpenAI-compatible API
# Set GROQ_API_KEY env var at runtime; empty string activates rule-based fallback.
# The three excluded autoconfigs validate an API key eagerly — excluding them lets
# the app start without a key; GroqProvider (optional ChatClient.Builder) handles
# the enabled/disabled decision at runtime.
spring.autoconfigure.exclude=\
  org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration,\
  org.springframework.ai.model.chat.client.autoconfigure.ChatClientAutoConfiguration
spring.ai.openai.api-key=${GROQ_API_KEY:}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=llama3-8b-8192
